<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whatsapp do meu amor</title>
    <link rel="stylesheet" href="style9.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <script src="script9.js" defer></script>
</head>
<body>

    <header>

        <a href="index.html">
            <button class="return">
                <i class="ri-arrow-left-s-line"></i>
            </button>
        </a>

        <div class="title"><h1> Conversas </h1></div>

        <div class="menu-right">

            <div class="camera"><i class="ri-camera-fill"></i></div>
            <div class="add"><i class="ri-add-large-line"></i></div>

        </div>

    </header>

    <main>

        <div class="conversas">

            <div class="conversa" data-chat="0">

                <div class="conversa-left">
                    <div class="photo ft1"></div>
                    <div class="user-conversa">
                        <div class="nome">Bbzonildo💐</div>
                        <div class="ultima-conversa">Eu te amo..</div>
                    </div>
                </div>

                <div class="horario-naolida">
                    <div class="hora">18h00</div>
                    <div class="msg-nnlida">4</div>
                </div>

            </div>

            <div class="conversa" data-chat="1">

                <div class="conversa-left">
                    <div class="photo ft2"></div>
                    <div class="user-conversa">
                        <div class="nome">Emilly</div>
                        <div class="ultima-conversa">Mensagem de voz ()</div>
                    </div>
                </div>

                <div class="horario-naolida">
                    <div class="hora">18h00</div>
                    <div class="msg-nnlida">2</div>
                </div>

            </div>

            <div class="conversa" data-chat="2">

                <div class="conversa-left">
                    <div class="photo ft3"></div>
                    <div class="user-conversa">
                        <div class="nome">Esther</div>
                        <div class="ultima-conversa">Mensagem de voz ()</div>
                    </div>
                </div>

                <div class="horario-naolida">
                    <div class="hora">18h00</div>
                    <div class="msg-nnlida">2</div>
                </div>

            </div>

            <div class="conversa" data-chat="3">

                <div class="conversa-left">
                    <div class="photo ft4"></div>
                    <div class="user-conversa">
                        <div class="nome">DIVA Myllena</div>
                        <div class="ultima-conversa">Mensagem de voz ()</div>
                    </div>
                </div>

                <div class="horario-naolida">
                    <div class="hora">18h00</div>
                    <div class="msg-nnlida">2</div>
                </div>

            </div>

            <div class="conversa" data-chat="4">

                <div class="conversa-left">
                    <div class="photo ft5"></div>
                    <div class="user-conversa">
                        <div class="nome">Ana Clara</div>
                        <div class="ultima-conversa">feliz aniversário..</div>
                    </div>
                </div>

                <div class="horario-naolida">
                    <div class="hora">18h00</div>
                    <div class="msg-nnlida">2</div>
                </div>

            </div>

            <div class="conversa" data-chat="5">

                <div class="conversa-left">
                    <div class="photo ft6"></div>
                    <div class="user-conversa">
                        <div class="nome">Duda</div>
                        <div class="ultima-conversa">Feliz aniversário...</div>
                    </div>
                </div>

                <div class="horario-naolida">
                    <div class="hora">18h00</div>
                    <div class="msg-nnlida">2</div>
                </div>

            </div>

        </div>
        
    </main>

    <footer>

        <div class="menu-bottom">

            <div class="att">
                <i class="ri-chat-history-line"></i>
                <p>Atualizações</p>
            </div>

            <div class="ligacao">

                <i class="ri-phone-line"></i>
                <p>Ligações</p>

            </div>

            <div class="comunidade">
                <i class="ri-group-line"></i>
                <p>Comunidades</p>
            </div>

            <div class="chat">
                <i class="ri-discuss-fill"></i>
                <p>Conversas</p>
            </div>

            <div class="voce">
                <div class="perfil-user"></div>
                <p>Você</p>
            </div>

        </div>

    </footer>

    <div class="chat-screen">

        <div class="chat-header">

            <button class="voltar">
                <i class="ri-arrow-left-line"></i>
            </button>

            <div class="chat-user">
                <div class="chat-photo"></div>
                <div class="chat-info">
                    <div class="chat-name">Meu bebê</div>

                    <div class="status">
                        online
                    </div>

                </div>
            </div>
            

        </div>

        <div class="mensagens">

        </div>

        <div class="chat-input">

            <input type="text" placeholder="Mensagem">
            <button>
                <i class="ri-send-plane-fill"></i>
            </button>

        </div>

    </div>

    <div class="foto-full">

        <img src="imgs/meu-amor.JPG">

    </div>

    <audio id="som-msg" src="sons/msg.mp3"></audio>     


</body>
</html>
