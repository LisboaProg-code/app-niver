<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google da Linducha</title>
    <link rel="stylesheet" href="style6.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
</head>
<body>
    
    <header>

        <a href="index.html">
            <button class="return">
                <i class="ri-arrow-left-s-line"></i>
            </button>
        </a>

        <div class="perfil-user"></div>

    </header>

    <main>

        <div class="google">

            <div class="conteiner-logo">
                <div class="logo"></div>
            </div>
            
            <div class="conteiner-barra-de-pesquisa">
                <div class="pesquisa">
                    <div class="topo">
                        <i class="ri-search-line"></i>
                    </div>
                    <div class="lista">
                        <a href="https://lisboaprog-code.github.io/meu-amor/" class="link-pesquisa">
                            <div class="item">Meu amor</div>
                        </a>

                        <a href="https://lisboaprog-code.github.io/Pedido/" class="link-pesquisa">
                            <div class="item">Pedido</div>
                        </a>

                        <a href="https://lisboaprog-code.github.io/Li/" class="link-pesquisa">
                            <div class="item">Primeiro site</div>
                        </a>

                        <a href="https://lisboaprog-code.github.io/teatro/" class="link-pesquisa">
                            <div class="item">Teatro Convite</div>
                        </a>
                    </div>
                </div>
            </div>


        </div>

    </main>

    <div class="conteiner-noticia">

        <div class="noticia">

            <div class="fonte">
                <div class="fonte-left">
                    <div class="perfil-fonte"></div>
                    <div class="nome">G1</div>
                </div>

                <div class="fonte-right">
                    <button class="seguir">Seguir</button>
                    <i class="ri-more-2-line"></i>
                </div>
            </div>

            <div class="card-noticia">
                <div class="foto-noticia"></div>
                <div class="texto">
                    <p>Lívia Joaquina: A Mulher Mais Linda do Mundo</p>
                </div>

                <div class="bottom-card">
                    <p>1 dia</p>

                    <div class="right-bottom-card">
                        <i class="ri-heart-line"></i>
                        <i class="ri-share-line"></i>
                    </div>
                </div>
            </div>
                
            </div>

        </div>

    </div>

    <script>

        const pesquisa = document.querySelector(".pesquisa");
        const topoPesquisa = document.querySelector(".topo"); // Seleciona especificamente a área do ícone
        const links = document.querySelectorAll(".link-pesquisa");

        topoPesquisa.addEventListener("click", (e) => {
            e.stopPropagation(); // Evita que o clique se espalhe
            pesquisa.classList.toggle("ativo");
        });

        links.forEach(link => {
            link.addEventListener("click", (e) => {
                e.stopPropagation(); // Garante que o clique vai direto para o href
            });
        });

        document.body.addEventListener("click", () => {
            pesquisa.classList.remove("ativo");
        });

        

    </script>

</body>
</html>
