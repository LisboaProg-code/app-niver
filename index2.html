<!DOCTYPE html>

            <div class="menu-bottom-child">
                <div class="bottom-menu">
                    <button class="mimage">
                        <i class="ri-multi-image-fill"></i>
                    </button>
                    <button class="archive">
                        <i class="ri-archive-stack-line"></i>
                    </button>

                <button class="search">
                    <i class="ri-search-line"></i>
