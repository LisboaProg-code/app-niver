<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Galeria do meu amor</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <script src="script2.js" defer></script>
</head>
<body>
    
    <header>

        <a href="index.html">
            <button class="return">
                <i class="ri-arrow-left-s-line"></i>
            </button>
        </a>

        <h1>Álbuns</h1>

        <div class="buttons-header">
            <button class="add">
                <i class="ri-add-large-fill"></i>
            </button>

            <button class="more">
                <i class="ri-more-line"></i>
            </button>
        </div>

    </header>

    <main>


        <div class="conteiner-top-menu-slider">
            <div class="top-menu-slider">
                <div class="pessoal">
                    <h1>Pessoal</h1>
                </div>
                <div class="outros">
                    <h1>Compartilhado</h1>
                </div>
                <div class="outros">
                    <h1>Atividade</h1>
                </div>
            </div>
        </div>


        <div class="conteiner-albuns">

            <div class="albuns">

                <div class="album album1" data-id="0">
                    <h1>Eu e ela</h1>
                </div>

                <div class="album album2" data-id="1">
                    <h1>Livia</h1>
                </div>

                <div class="album album3" data-id="2">
                    <h1>Amigos</h1>
                </div>

                <div class="album album4" data-id="3">
                    <h1>Familia</h1>
                </div>

            </div>

        </div>

        <div class="conteiener-bottom-menu">

            <div class="menu-bottom-child">
                <div class="bottom-menu">
                    <button class="mimage">
                        <i class="ri-multi-image-fill"></i>
                    </button>
                    <button class="archive">
                        <i class="ri-archive-stack-line"></i>
                    </button>
                </div>
                <button class="search">
                    <i class="ri-search-line"></i>
                </button>
            </div>

        </div>

    </main>

    <div class="album-overlay" id="albumOverlay">
        <div class="overlay-header">
            <button class="close-overlay" id="closeOverlay">
                <i class="ri-close-line"></i>
            </button>
            <h2 id="overlayTitle">Nome do Álbum</h2>
            <div style="width: 45px;"></div> <!-- Spacer para centralizar o título -->
        </div>
        
        <div class="overlay-content">
            <!-- As fotos do álbum serão inseridas aqui via JS -->
            <div class="photo-grid" id="photoGrid"></div>
        </div>
    </div>

    <!-- Visualizador da Imagem em Tela Cheia -->
    <div class="image-viewer" id="imageViewer">
        <button class="close-viewer" id="closeViewer">
            <i class="ri-close-line"></i>
        </button>
        <img src="" alt="Imagem Expandida" id="fullImage">
    </div>

</body>
</html>
